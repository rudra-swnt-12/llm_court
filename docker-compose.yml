services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: court-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://judge:gavel@db:5432/llm_court
    depends_on:
      db:
        condition: service_healthy

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: court-frontend
  #   volumes:
  #     - ./frontend/src:/app/src
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - .env
  #   depends_on:
  #     - backend

  db:
    image: pgvector/pgvector:pg16
    container_name: court-db
    restart: always
    environment:
      POSTGRES_USER: judge
      POSTGRES_PASSWORD: gavel
      POSTGRES_DB: llm_court
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge -d llm_court"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: